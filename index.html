<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First App</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        gap: 16px;
      }

      button {
        font-size: 1rem;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      #message {
        font-size: 1.5rem;
        min-height: 2rem;
      }
    </style>
  </head>
  <body>
    <button id="hello-btn">Click me</button>
    <p id="message"></p>

    <script>
      document
        .getElementById("hello-btn")
        .addEventListener("click", function () {
          document.getElementById("message").textContent = "hello";
        });
    </script>
  </body>
</html>
